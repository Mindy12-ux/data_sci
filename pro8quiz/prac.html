<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .man{color: green;}
        .woman{color: blue;}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        window.onload = () =>{
            document.getElementById('btn').onclick = showData;
        }

        async function showData(){
            const id = document.getElementById('id').value;
            const pwd = document.getElementById('pwd').value;
            const result = document.getElementById('result');

            if(id!=='python' || pwd!=='123'){
                result.innerHTML="아이디와 비밀번호를 다시 확인해주세요";
                return;
            }

            try{

                const reponse = await axios.get('gogekdata.json');
                const data = reponse.data;

                let output = '<table>'
                output += `
                    <tr>
                        <td>고객명</td><td>고객전화</td><td>성별</td>
                    </tr>
                `

                data.forEach(item => {
                    const colorClass = 
                    item.gender === "남"? 'man':'woman';

                    output += `<tr>
                        <td class="${colorClass}">${item.name}</td>
                        <td>${item.tel}</td>
                        <td>${item.gender}</td>
                        </tr>
                    `;
})
                output += '</table>'
                result.innerHTML = output;


            }catch(error){
                result.innerHTML = '에러 발생 : ' + error;
            }

        }
    </script>
</head>
<body>
    <h2>직원 정보 출력</h2>
    ID : <input type="text" id="id" ><br>
    PWD : <input type="text" id="pwd" ><br>
    <button id="btn">직원 정보 출력</button>
    <div id="result"></div>
</body>
</html>

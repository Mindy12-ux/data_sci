<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        // 위치가 head 태그에 있을 때는 window.onload를 써줘야 아래 이벤트가 실행될 수 있음
        window.onload = () => {
            document.querySelector("#btn1").onclick = funcAsync;
            document.querySelector("#btn2").onclick = funcAxios;
        }


        // 공통 출력 함수
        function showSangpum(data, title){
            let output = `<h3>${title}</h3>`;
            output += '<table border = "1">';
            output += `<tr><td>코드</td><td>품명</td><td>수량</td><td>단가</td><td>금액</td></tr>`
            let total = 0;

            data.forEach(item =>{
                let price = item.su * item.dan;
                total += price;
                output += `
                <tr>
                    <td>${item.code}</td>
                    <td>${item.sang}</td>
                    <td>${item.su}</td>
                    <td>${item.dan.toLocaleString()}</td>
                    <td>${price.toLocaleString()}</td>
                </tr>
                `;
            })

            output += `
                <tr>
                    <td colspan ='4'>총 금액 : </td>  
                    <td><b>${total.toLocaleString()}원</b></td>
                </tr>
            `;  // 4개의 열을 하나로 합침

            output += `</table>`;

            document.querySelector("#result").innerHTML = output;

        }

        // 1. fetch then 방식
        async function funcAsync(){
            const result = document.querySelector("#result");
            result.innerHTML = '데이터를 불러오는 중 ... '

            try{
                const response = await fetch("sangpum.py");

                if(!response.ok){
                    throw new Error(`HTTP 오류 : ${response.status}`);
                }

                const data = await response.json();  // JSON 객체화
                if(!Array.isArray(data)){  // isArray : 배열 여부 확인
                    throw new Error(`JSON 데이터가 배열이 아님`);
                }

                // 재고가 있는 상품만 선택
                const stockData = data.filter(item => item.su > 0);  // filter 함수로 걸러줌

                // 코드 순으로 오름차순 정렬
                stockData.sort((a, b) => a.code - b.code); 
                console.log("정렬된 결과 : ", stockData);

                // 출력 함수 호출
                showSangpum(stockData, "ASYNC FETCH 결과")

            }catch(error){
                result.innerHTML = '오류 발생 : ' +error.message; 
            }finally{
                console.log("fetch 작업 종료");
            }

        }

        // 2. axios : json 변환 자동 발생
        async function funcAxios(){
            const result = document.querySelector("#result");
            result.innerHTML = '데이터를 불러오는 중 ... '

            try{
                const response = await axios.get('sangpum.py',
                    {
                        timeout:3000   // 3초 안에 응답이 오지 않으면 요청을 실패로 처리한다.
                    }
                );
                console.log('axios response', response)
                const data = response.data;

                if(!Array.isArray(data)){  
                    throw new Error(`JSON 데이터가 배열이 아님`);
                }

                // 재고가 있는 상품만 선택
                const stockData = data.filter(item => item.su > 0); 

                // 코드 순으로 오름차순 정렬
                // stockData.sort((a, b) => a.code - b.code); 
                // console.log("정렬된 결과 : ", stockData);

                // 출력 함수 호출
                showSangpum(stockData, "ASYNC FETCH 결과")


            }catch(error){
                result.innerHTML = '오류 발생 : ' +error.message; 
            }finally{
                console.log("axios 작업 종료");
            }
        }

    </script>
</head>
<body>
    <h3>보다 실무적인 AJAX 처리</h3>  
    <button id = 'btn1'>1번 : async fetch</button>
    <button id = 'btn2'>2번 : axios library</button>
    <hr>
    <div id ="result"></div>
</body>
</html>

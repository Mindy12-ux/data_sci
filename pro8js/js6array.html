<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    js Array : 순서가 있는 여러 개의 자료를 대표명으로 주고 첨자로 각 기억장소를 구분하는 자료구조<br>
    반복처리가 효과적<br>
    형식 : 배열명 = new Array();
    파이썬은 numpy의 배열을 사용, 파이썬 자체의 배열은 사용하지 않고 리스트, 튜블, 셋 등만 사용

    <hr>
    <script type="text/javascript">
        let aa = new Array();   // 배열 객체 생성, 배열 선언. 크기는 가변적. new Array(3) 형식으로 크기를 줄 수 있으나 권장하지 않음
        aa[0] = 10; aa[1] = 5.6; aa[3] ="결과는?"; aa[6] = '안녕'; aa[7] =true; 
        aa[8] = {kbs:9, sbs:5} // 배열 요소값 타입은 마음대로 줄 수 있음, json 타입도 가능  
        document.write('배열 크기 : ', aa.length);
        document.write('<br>배열 타입 : ', typeof(aa));
        document.write("<br> 배열 출력 : ",aa);

        let first_num = 0, pre_num = 0;
        document.write(`<br>${aa[0]} ${aa[1]} ${aa[first_num]} ${aa[pre_num]}<br>`); // 인덱스는 상수 또는 변수로 지정 가능
    
        // 비어있는 항목은 건너뛰고 출력하기 실습
        let len = 0; 
        while(len < aa.length){
            document.write("<br>", aa[len]);
            len++;
        }

        document.write("<br>");
        let bb = new Array(100, 200, 300); // 배열 선언 시 초기치 부여
        document.write(`<br>${bb[0]} ${bb[1]} ${bb[2]}`);

        document.write("<br>");

        let cc = [];  // 비어 있는 배열 선언
        cc[0] = 'The odyssey';
        cc.push('seoul'); // push 메소드로 배열에 값을 저장
        cc.push(2026, 9, '하나');
        document.write(`<br>${cc[0]} / ${cc[1]} / ${cc[2]} / ${cc[3]} / ${cc[4]}`);
        cc[99] = 'wow';
        document.write(`<br> cc 배열의 크기는 ${cc.length}`) // cc 배열의 크기는 100

        document.write("<hr>");

        let dd = new Array(); // 배열 선언 후 for를 이용해 자료 입출력


        for(let i= 0; i < 10; i++){
            dd[i] = i*100;
            document.write(dd[i],"<br>");
        }
                
        document.write("<br>")
        let myarr = [
            "안녕",
            true,
            2.3,
            {name:'한가해'},
            function(){
                document.write('난 함수');
            }
        ];

        // for(let a = 0; a < myarr.length; a ++){
        //     document.write(myarr[a],'<br>');
        //     if (typeof[a] === 'function')

        // }
        // myarr[4]();  // 함수 실행
        // document.write(typeof(myarr[4]))
        // document.write("<br>")

        document.write('<br>');
        let korea = ['가을', '미세먼지 없음', '쾌청']; // for로 배열 요소 값 출력
        
        // 방법 1
        for(let i = 0; i <korea.length; i ++){
            document.write(korea[i] + " ");
        }

        document.write('<br>');

        // 방법 2 : of는 배열의 값을 하나씩 꺼냄
        for (let i of korea){
            document.write(i + " ");
        }

        document.write('<br>');

        // 방법 3 : in는 인덱스를 하나씩 꺼냄
        for (let i in korea){
            document.write(korea[i] + " ");
        }

        document.write("<hr>");
        // 배열 요소 제거 : delete, splice

        let ar = ['i', 'go', 'home'];
        delete ar[1]; // go 삭제, go의 자리는 남아있음. 즉, 전체 크기는 삭제 전과 동일함
        document.write(ar , " ", ar.length );

        document.write("<br>");
        ar = ['i', 'go', 'home'];
        ar.splice(1, 1); // 인덱스 1부터 1개 삭제
        document.write(ar , " ", ar.length );

        document.write("<hr>")
        // 구조 분해 할당 : 배열, 객체의 값들을 추출하여 한 번에 여러 변수에 할당
        let nums = [1,2,3,4];
        let [a1, a2, a3] = nums;
        document.write(`${a1} ${a2} ${a3}`, " ", typeof(a1), " ", typeof(nums)) // 1 2 3 number object
        document.write("<br>")
        let [b1, , ,b4] = nums;
        document.write(`${b1} ${b4}`)

        document.write("<br>")
        let person = {name : 'tom', age:20};  // json type, 제이슨 타입의 자료를 일반 string 변수로 만들 수 있다.
        let {name, age} = person;
        document.write(`${name} ${age}`, " ", typeof(name), " ", typeof(person)) // tom 20 string object

        document.write("<br>")
        let persons = {name2 : 'tom', age2:20};  // json type
        let {name2, age2} = persons;
        document.write(`${name2} ${age2}`, " ", typeof(name2), " ", typeof(persons))

        // 전개 연산자: ...
        // 배열이나 객체의 요소를 펼쳐서 복사하거나 결합할 때 사용
        document.write("<br><br>");
        let fruits = ['apple', 'peach', 'melon'];
        let repo = [...fruits]; // 배열 요소를 펼쳐서 새로운 배열에 저장
        document.write(repo, " ", repo.length);
        document.write("<br>", fruits === repo); // false
        let fr = fruits;  // 주소 치환
        document.write("<br>", fruits === fr);  // true

        document.write("<br>");
        const a = ['apple', 'peach'];
        const b = ['melon', 'banana'];
        const c = [...a, ...b]; // 베열 합치기
        document.write(c)
        document.write("<br>", c.join(" ")) // 배열 요소들을 하나의 문자열로 합치기
        document.write("<br>", typeof(c.join(" ")), "<br>", typeof(c)) // string, object

        

    </script>
</body>
</html>

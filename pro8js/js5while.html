<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>*반복문 while*</h3>
    <script>
        let k = 0;
        while(k < 10){
            k++;
            if(k % 2 === 0 || k === 3) continue;  // continue를 만나서 출력값을 찍지 않고 다시 위로 올라감. 
            document.write(k + " ");
            if (k ===9 ) break;

        }
    </script>
</body>
</html>

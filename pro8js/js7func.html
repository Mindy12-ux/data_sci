<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type = "text/javascript">
        function bb(){
            document.write('bb 함수 실행 성공');
            // cc();   // 함수가 다른 함수 호출 성공 (반환 값 무시), kk는 NaN
            // cc(1,2,3);  // 파라미터 갯수가 일치하지 않아도 수행됨

            let re = cc(5); // 반환값 처리
            document.write(`<br>re : ${re}`)  // kk는 15, re : 15
            
            dd(7,8);  // dd 함수에서 7 8
            dd(7,8,9);  // dd 함수에서 7 8
            dd(7);  // dd 함수에서 7 undefined
            dd();  // dd 함수에서 undefined undefined
        
        
        }

        function cc(para){  // 매개 변수가 있는 함수
            let kk = para + 10;
            document.write(`<br> kk는 ${kk}`);
            return kk;
        }

        function dd(para1, para2){
            document.write(`<br>dd 함수에서 ${para1} ${para2}`);
        }

            // 전역, 지역 변수
            let a = 100;         // 전역 변수
            const b = 200;       // 전역 상수
            function func(){
                let c = 300;    // 지역 변수
                const d = 400;  // 지역 상수
                document.write(`<br>a:${a} b:${b}`);
                document.write(`<br>c:${c} d:${d}`);
            }
            
    </script>
</head>
<body>
    <h3>** 함수(fuction) : 어떤 특별한 목적의 작업을 수행하도록 설계된 독립적 블록{}을 의미 **</h3>
    <pre>
    필요할 때 호출하여 반복처리, 자원의 재활용 가능

    funtion 함수명(매개변수){
        실행문;
        return 반환값;
    }
    </pre>

    <script>
        // 내장함수 : js가 기본적으로 지원하는 함수
        let str = "Java Script Language";
        document.write(str);
        document.write(`<br>str.charAt(2) : ${str.charAt(2)}`);
        document.write(`<br>str.bold() : ${str.bold()}`);
        document.write(`<br>Math.abs(-7) : ${Math.abs(-7)}`);
    </script>

    <hr>
    사용자 정의 함수<br>
    <script>
        let count = 0;
        function aa(){      // 함수 선언
            count += 1;
            document.write(count + "번 수행<br>");

        }
        // let count = 0;
        // function aa(){      // 함수 선언
        //     for(count; count < 10; count++)
        //     // count += 1;
        //     document.write(count + "번 수행<br>");

        // }
        aa();  // 함수 실행, 1번 수행
        document.write("함수는 참조형 타입 : 1을 출력하고 다시 호출하면 2를 출력함");
    </script>
    <div>오늘은 금요일</div>

    <script>
        aa();  // 2번 수행
    </script>
    <hr>
    <div><b>생각의 전환 : </b>html 선언부에 js 코드(함수)를 작성 후 함수 호출</div>
    <script>
        bb();   // bb 함수 호출 후 실행
    </script>
    <hr>
    <script>
        document.write("<br>전역, 지역 변수의 이해");

        func();
        document.write(`<br>a:${a} b:${b}`);
        // document.write(`<br>c:${c} d:${d}`);  // 지역변수이므로 에러
    </script>


</body>
</html>

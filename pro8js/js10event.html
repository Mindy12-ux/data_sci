<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function func(){
            // 이벤트 처리용 함수 (event handler function)
            let datetime = "2026-09-18";
            let arrData = datetime.split("-");
            console.log(`${arrData[0]}년 ${arrData[1]}월 ${arrData[2]}일`);
        }        
    </script>
</head>
<body>
    <h3>* 이벤트(사용자의 동작이나 브라우저에서 발생하는 특정 상황) 처리 *</h3>
    예: 버튼 클릭, 마우스 이동, 키보드 입력, 값 변경, 페이지 로딩, 폼 자료 전송 등 <br>
    <a href="https://www.naver.com">네이버 : 클릭 이벤트 발생</a><br>
    <a href="javascript:func()">이벤트 처리 함수 호출 (이벤트 핸들러 사용안함)</a><br>
    <br>이벤트 핸들러는 on이벤트 종류 = 핸들러 함수()
    <br>
    <a href="javascript:onclick=func()">이벤트 처리 함수 호출2(이벤트 핸들러 사용)</a><br>
    onclick : 이벤트 핸들러  func() : 이벤트 핸들러에 의해 실행될 함수<br>
    <a href="https://www.naver.com"><button>naver</button></a><br>
    <button ondblclick="func()">이벤트 처리 함수 호출3</button>
    <input type="button" value="이벤트 처리 함수 호출4" onclick='func()'/>


</body>
</html>

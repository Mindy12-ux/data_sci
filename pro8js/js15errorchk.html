<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>에러 체크</title>
    <!-- bootstrap 제공 css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" 
    rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" 
    crossorigin="anonymous">

    <script>
        /*
        window.onload = () => { // 페이지 전체(html, js, 이미지 등) 로딩 완료 후
            document.querySelector('#btnSend').onclick = chkDataFunc;
            document.querySelector('#btnClear').onclick = clskDataFunc;
        }
        */
    
        document.addEventListener('DOMContentLoaded', () => {   // DOM 생성 완료(이미지 등은 천천히) 후
            document.querySelector('#btnSend').onclick = chkDataFunc;
            document.querySelector('#btnClear').onclick = clskDataFunc;
        })

        function chkDataFunc(){
            alert('a');
        }

        function clskDataFunc(){
            alert('b');
        }

    </script>
</head>
<body>
<h2>* 고객 자료 입력 *</h2>
<!--
<form name ='frm' action="서버호출명" method="get"></form>   원래는 이렇게 써주는게 정석임
-->
<form name = 'frm'>
<table class="table table-dark table-hover">
    <tr>
        <td>이 름</td>
        <td><input type ='text' name ='name' id= 'name' value ='신기해'/></td>
    </tr>
    <tr>
        <td>아 이 디</td>
        <td><input type ='text' name ='id' id= 'id' placeholder="3글자 이상"/></td>
    </tr>
    <tr>
        <td>이 메 일</td>
        <td><input type ='email' name ='email' id= 'email' value="abc@abc.com"/></td>
    </tr>
    <tr>
        <td>나 이</td>
        <td><input type ='text' name ='age' id= 'age'/></td>
    </tr>
    <tr>
        <td colspan="2" style="text-align: center;">
            <input type="submit" id="btnSend" value="자료 전송" class="btn btn-primary">
            <input type="reset" id="btnClear" value="자료 삭제" class="btn btn-info">
        </td>
    </tr>
    
</table>

</form>
</body>
</html>
